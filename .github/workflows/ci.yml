name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Let every leg report. A failure on one is far easier to read when you
      # can see whether the other passed.
      fail-fast: false
      matrix:
        include:
          # The declared minimum (pubspec.yaml), resolved to the LOWEST allowed
          # versions, so this leg is what proves the lower bounds -- material_ui
          # 1.0.0 in particular -- rather than only what pub picks by default.
          - label: '3.44.0, lowest deps'
            flutter-version: '3.44.0'
            pub-command: downgrade
          # The same minimum with what `pub get` actually gives a 3.44 user: the
          # newest material_ui that still allows 3.44, which neither the leg
          # above nor stable resolves.
          - label: '3.44.0'
            flutter-version: '3.44.0'
          # An empty flutter-version means "newest on the channel".
          # Passing the literal string 'stable' is rejected by the action:
          # "Unable to determine Flutter version for channel: stable".
          - label: stable
            flutter-version: ''

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub ${{ matrix.pub-command || 'get' }}

      # The package is formatted at dart format's default 80 columns, which is
      # also what pub.dev's pana scores. Do not add --line-length here.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        # Upload once; two identical reports add nothing.
        if: matrix.label == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fork PRs have no token, and a missing token must not turn a green
          # test run red.
          fail_ci_if_error: false

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Two things at once: pub's own publish validation, and a check that the
      # archive does not carry build output.
      #
      # `.pubignore` REPLACES `.gitignore` for pub rather than adding to it, so
      # every path .gitignore covers but .pubignore omits (build/, coverage/,
      # .fvm/, ...) is silently packaged. A fresh CI checkout has none of those
      # directories, so a plain dry run here would look clean while a publish
      # from a developer's working tree ships tens of megabytes of .dill files.
      # Plant sentinels so the check is deterministic instead of incidental.
      - name: Publish dry run
        run: |
          set -euo pipefail
          mkdir -p build coverage
          touch build/SENTINEL_MUST_NOT_PUBLISH coverage/SENTINEL_MUST_NOT_PUBLISH
          flutter pub publish --dry-run 2>&1 | tee dry-run.log
          if grep -q SENTINEL_MUST_NOT_PUBLISH dry-run.log; then
            echo "::error file=.pubignore::build/ or coverage/ would be published. \
          .pubignore replaces .gitignore for pub, so it must list them itself."
            exit 1
          fi
          rm -f build/SENTINEL_MUST_NOT_PUBLISH coverage/SENTINEL_MUST_NOT_PUBLISH

      # Scored 150/160 locally at the time of writing. The missing 10 points are
      # pana's repository-URL check, which clones the repo's DEFAULT branch and
      # compares its pubspec: main still carries the old `rvndsngwn` URL, so the
      # check only passes once this work is merged. Until then a threshold would
      # fail every run, so this step reports the score without gating on it.
      # After merge, confirm 160/160 and add `--exit-code-threshold 0` to turn
      # this into a real gate.
      - name: Score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning
