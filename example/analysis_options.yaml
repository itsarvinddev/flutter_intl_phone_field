# Analyzer configuration for the example app.
#
# The example is an app, not the published package, so it uses the stock
# Flutter rule set rather than inheriting the package's stricter one
# (../analysis_options.yaml). The excludes below cover the platform runner
# directories, which `flutter create` generates and which are not ours to lint.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Demos legitimately print to show what the widget reports back.
    avoid_print: false
