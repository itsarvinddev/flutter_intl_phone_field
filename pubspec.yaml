name: flutter_intl_phone_field
description: >-
  International phone number input for Flutter: country picker, as-you-type
  formatting, and libphonenumber-accurate validation for 250+ countries.
version: 0.1.2
homepage: https://github.com/itsarvinddev/flutter_intl_phone_field
repository: https://github.com/itsarvinddev/flutter_intl_phone_field
issue_tracker: https://github.com/itsarvinddev/flutter_intl_phone_field/issues
documentation: https://github.com/itsarvinddev/flutter_intl_phone_field#readme
funding:
  - https://github.com/sponsors/itsarvinddev

screenshots:
  - description: "Five IntlPhoneField variants on one screen: default, as-you-type formatted, circular flag, flag only, and a custom selector"
    path: image-1.png
  - description: "The country picker, with search, favourite countries pinned on top, and the selected country highlighted"
    path: image-2.png
  - description: "A field showing a validation error, beside the PhoneNumber value it reports"
    path: image-3.png

topics:
  - phone
  - phone-number
  - form
  - input
  - validation

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/
