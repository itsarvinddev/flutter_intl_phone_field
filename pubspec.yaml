name: flutter_intl_phone_field
description: >-
  International phone number input for Flutter: country picker, as-you-type
  formatting, and libphonenumber-accurate validation for 250+ countries.
version: 0.1.0
homepage: https://github.com/itsarvinddev/flutter_intl_phone_field
repository: https://github.com/itsarvinddev/flutter_intl_phone_field
issue_tracker: https://github.com/itsarvinddev/flutter_intl_phone_field/issues
documentation: https://github.com/itsarvinddev/flutter_intl_phone_field#readme
funding:
  - https://github.com/sponsors/itsarvinddev

screenshots:
  - description: "Phone number field with country picker"
    path: image-1.png
  - description: "Searchable country picker"
    path: image-2.png

topics:
  - phone
  - phone-number
  - form
  - input
  - validation

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/
